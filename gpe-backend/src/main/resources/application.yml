server:
  port: 8081

spring:
  application:
    name: gpe-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gpe}

  datasource:
    url: jdbc:postgresql://localhost:5432/gpe_db
    username: gpe_user
    password: gpe_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Deixa o controle de schema 100% com o Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

app:
  signature:
    mock:
      failure: ${SIGNATURE_MOCK_FAILURE:false}
      result-status: ${SIGNATURE_MOCK_RESULT_STATUS:AGUARDANDO_ASSINATURA}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO

gpe:
  storage:
    documentos: ${DOCUMENT_STORAGE_PATH:${GPE_DOCUMENTOS_DIR:./storage/documentos}}
