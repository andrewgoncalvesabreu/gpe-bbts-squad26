server:
  port: 8081

spring:
  application:
    name: gpe-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/gpe_db
    username: gpe_user
    password: gpe_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Deixa o controle de schema 100% com o Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO